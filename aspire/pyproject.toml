[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aspire-sysid"
version = "0.1.0.dev0"
description = "Harness of ASPIRE (Agentic System-identification Platform for Iterative Reasoning and Exploration)"
readme = "README.md"
license = { text = "CC-BY-4.0" }
requires-python = ">=3.11"
authors = [
    { name = "Erik Derner" },
    { name = "Jiri Kubalik" },
    { name = "Robert Babuska" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
runner = ["openai>=1.60", "anthropic>=0.40"]

[project.scripts]
aspire = "aspire_sysid.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aspire_sysid*"]
